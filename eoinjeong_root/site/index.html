<title>어인정 수순 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 청색 원고지: 칸 하나에 음절 하나. 지도는 원고지 한 장, 수순은 한 수에 한 줄씩 적어 내려간다. */
:root {
  --paper: #f5f8fb;
  --sheet: #ffffff;
  --rule: #9db3d1;
  --rule-soft: #dce5f1;
  --ink: #18202c;
  --ink-soft: #566173;
  --accent: #2b4c8c;
  --win: #1d6b45;
  --win-bg: #dcefe3;
  --lose: #ad3b2c;
  --lose-bg: #f6e0db;
  --open: #687180;
  --open-bg: #eaedf2;
  --focus: #1d5fd1;
  --f-display: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cell: 44px;
  --pcell: 30px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f141c; --sheet: #141b26; --rule: #3c5378; --rule-soft: #1f2a3b; --ink: #e3e9f2; --ink-soft: #9ba8bb;
    --accent: #93b2ee; --win: #7fd3a4; --win-bg: #15321f; --lose: #f09a8b; --lose-bg: #3b1e1a; --open: #a6aebb;
    --open-bg: #222a36; --focus: #7fb0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f141c; --sheet: #141b26; --rule: #3c5378; --rule-soft: #1f2a3b; --ink: #e3e9f2; --ink-soft: #9ba8bb;
  --accent: #93b2ee; --win: #7fd3a4; --win-bg: #15321f; --lose: #f09a8b; --lose-bg: #3b1e1a; --open: #a6aebb;
  --open-bg: #222a36; --focus: #7fb0ff; color-scheme: dark;
}
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.15; }
h2 { font-size: 21px; }
h3 { font-size: 16px; font-family: var(--f-body); font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; gap: 18px 28px; align-items: end; justify-content: space-between; }
.top .intro { min-width: 0; flex: 1 1 420px; display: grid; gap: 10px; }
.eyebrow { font-size: 12.5px; letter-spacing: .06em; color: var(--ink-soft); }
.lede { color: var(--ink-soft); max-width: 62ch; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 10px; border-radius: 999px; font-size: 13px;
  background: var(--open-bg); color: var(--open); white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill b { font-weight: 600; }
.pill.win { background: var(--win-bg); color: var(--win); }
.pill.lose { background: var(--lose-bg); color: var(--lose); }
.pill.ink { background: var(--rule-soft); color: var(--accent); }

.section { display: grid; gap: 12px; min-width: 0; }
.note { color: var(--ink-soft); font-size: 14px; max-width: 70ch; }
ul.note { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* 원고지 한 장 */
.sheet { background: var(--sheet); border: 1px solid var(--rule); padding: 14px; display: grid; gap: 14px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell), 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.cell { position: relative; aspect-ratio: 1; max-width: 100%; border: 0; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  background: transparent; font-family: var(--f-display); font-size: 19px; font-weight: 700; cursor: pointer; padding: 0; }
.cell.win { background: var(--win-bg); color: var(--win); }
.cell.lose { background: var(--lose-bg); color: var(--lose); }
.cell:hover { box-shadow: inset 0 0 0 2px var(--accent); }
.cell .of { position: absolute; right: 2px; bottom: 0; font-family: var(--f-body); font-size: 9.5px; font-weight: 500; color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border: 1px solid var(--rule); display: inline-block; }
.sw.win { background: var(--win-bg); } .sw.lose { background: var(--lose-bg); }

/* 탐색기 */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.btn[disabled]:hover { border-color: var(--rule); color: inherit; }
.rows { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; }
.row .who { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; font-variant-numeric: tabular-nums; }
.row .who b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
.line { display: flex; flex-wrap: wrap; border-left: 1px solid var(--rule); min-width: 0; }
.pc { width: var(--pcell); height: var(--pcell); display: grid; place-items: center; border: 1px solid var(--rule); border-left: 0;
  margin-bottom: -1px; font-family: var(--f-display); font-weight: 700; font-size: 16px; background: var(--sheet); }
.pc.head { box-shadow: inset 0 -3px 0 var(--rule-soft); }
.pc.tail { background: var(--rule-soft); color: var(--accent); }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--open-bg); color: var(--open); }
.tag.win { background: var(--win-bg); color: var(--win); } .tag.lose { background: var(--lose-bg); color: var(--lose); }

.now { border: 1px solid var(--rule); background: var(--sheet); padding: 16px; display: grid; gap: 14px; min-width: 0; }
.now-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
.now-head h2 { outline: none; }
.verdict { font-size: 15px; }
.verdict b { font-weight: 600; }
.verdict.win b { color: var(--win); } .verdict.lose b { color: var(--lose); } .verdict.open b { color: var(--open); }
.proof { font-family: var(--f-mono); font-size: 12px; color: var(--ink-soft); overflow-wrap: anywhere; }
.group { display: grid; gap: 8px; }
.group h3 { display: flex; gap: 8px; align-items: baseline; }
.group h3 .n { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink-soft); font-weight: 400; }
.moves { display: flex; flex-wrap: wrap; gap: 6px; }
.mv { border: 1px solid transparent; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 15px; text-align: left; max-width: 100%;
  overflow-wrap: anywhere; background: var(--open-bg); color: var(--ink); }
.mv .t { color: var(--accent); font-weight: 600; }
.mv.win { background: var(--win-bg); border-color: color-mix(in srgb, var(--win) 35%, transparent); }
.mv.lose { background: var(--lose-bg); }
.mv:hover { border-color: var(--accent); }
.empty { color: var(--ink-soft); font-size: 14px; }
.loading, .error { color: var(--ink-soft); }
.error { color: var(--lose); }
footer { font-size: 12.5px; color: var(--ink-soft); display: grid; gap: 4px; border-top: 1px solid var(--rule-soft); padding-top: 14px; }
footer code { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; }

@media (max-width: 560px) {
  :root { --cell: 38px; --pcell: 26px; }
  .cell { font-size: 16px; }
  .row { grid-template-columns: 1fr auto; }
  .row .line { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) {
  .cell, .mv, .btn { transition: box-shadow .12s, border-color .12s, color .12s; }
}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="intro">
      <div class="eyebrow">어인정 표준사전 루트단어 621단어 · 표준두음법칙 · 한 경기 안 재사용 금지</div>
      <h1>어인정 수순 지도</h1>
      <p class="lede">verify_v4 검증을 통과한 증명서로만 판정합니다. 음절을 누르면 그 음절을 받은 자리부터 한 수씩 따라갈 수 있습니다.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>
  <main id="view"><p class="loading">자료를 불러오는 중…</p></main>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
(function () {
  var D = null, nodes = new Map(), byFirst = new Map();
  var view = document.getElementById("view");

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("ko-KR"); }

  // 엔진의 표준두음법칙(한 방향): ㄹ+ㅑㅕㅖㅛㅠㅣ→ㅇ, ㄹ+ㅏㅐㅗㅚㅜㅡ→ㄴ, ㄴ+ㅕㅛㅠㅣ→ㅇ
  function conv(ch) {
    var o = ch.charCodeAt(0) - 0xac00;
    if (o < 0 || o >= 11172) return null;
    var ini = Math.floor(o / 588), rem = o % 588, vow = Math.floor(rem / 28);
    if (ini === 5 && [2, 6, 7, 12, 17, 20].indexOf(vow) >= 0) return String.fromCharCode(0xac00 + 11 * 588 + rem);
    if (ini === 5 && [0, 1, 8, 11, 13, 18].indexOf(vow) >= 0) return String.fromCharCode(0xac00 + 2 * 588 + rem);
    if (ini === 2 && [6, 12, 17, 20].indexOf(vow) >= 0) return String.fromCharCode(0xac00 + 11 * 588 + rem);
    return null;
  }
  function last(w) { return w.charAt(w.length - 1); }
  function current(si, h) { return h.length ? last(D.words[h[h.length - 1]]) : D.syllables[si].s; }
  function legal(si, h) {
    var c = current(si, h), alt = conv(c), used = new Set(h);
    var ids = (byFirst.get(c) || []).concat(alt ? byFirst.get(alt) || [] : []);
    return ids.filter(function (i) { return !used.has(i); }).sort(function (a, b) { return a - b; });
  }
  function node(si, h) { return nodes.get([si].concat(h).join(".")) || null; }
  function route(si, h) { return "#s" + si + h.map(function (i) { return "-" + i; }).join(""); }
  function parse(hash) {
    var m = /^#s(\d+)((?:-\d+)*)$/.exec(hash || "");
    if (!m) return null;
    var si = +m[1], h = m[2] ? m[2].slice(1).split("-").map(Number) : [];
    if (!(si < D.syllables.length)) return null;
    for (var k = 0; k < h.length; k++) if (legal(si, h.slice(0, k)).indexOf(h[k]) < 0) return null;
    return { si: si, h: h };
  }
  function certUrl(n) {
    var c = D.certs[n.c];
    return D.release_base + D.tags[c[0]] + "/" + c[1] + ".v4.gz";
  }
  function mover(ply) { return ply % 2 === 0 ? "받는 쪽" : "낸 쪽"; }
  function other(ply) { return ply % 2 === 0 ? "낸 쪽" : "받는 쪽"; }

  function load() {
    fetch("data.json").then(function (r) {
      if (!r.ok) throw new Error("data.json을 불러오지 못했어요 (" + r.status + ").");
      return r.json();
    }).then(function (d) {
      D = d;
      d.nodes.forEach(function (line) {
        var sp = line.indexOf(" "), v = line.slice(sp + 1);
        nodes.set(line.slice(0, sp), { r: v.charAt(0), c: +v.slice(1) });
      });
      d.words.forEach(function (w, i) {
        var f = w.charAt(0);
        if (!byFirst.has(f)) byFirst.set(f, []);
        byFirst.get(f).push(i);
      });
      renderTally();
      renderFoot();
      show();
      window.addEventListener("hashchange", show);
    }).catch(function (e) {
      view.innerHTML = '<p class="error">' + esc(e.message) + " 페이지를 새로 고쳐 다시 시도해 주세요.</p>";
    });
  }

  function renderTally() {
    var w = D.syllables.filter(function (s) { return s.r === "W"; }).length;
    document.getElementById("tally").innerHTML =
      '<span class="pill win">받으면 승 <b>' + w + "</b></span>" +
      '<span class="pill lose">받으면 패 <b>' + (D.syllables.length - w) + "</b></span>" +
      '<span class="pill ink">확정한 자리 <b>' + fmt(nodes.size) + "</b></span>";
  }
  function renderFoot() {
    document.getElementById("foot").innerHTML =
      "<div>사전 <code>words_621.txt</code> · sha256 <code>" + esc(D.dictionary_sha256) + "</code></div>" +
      "<div>이 판정은 이 사전에서만 유효합니다. 817단어(기초사전 루트)나 3,683단어(구없샘) 판정과 다를 수 있습니다.</div>" +
      '<div>원자료와 표: <a href="https://github.com/baekjw2435/AI-/tree/ccr-f69ebb18-kv98jq/eoinjeong_root" target="_blank" rel="noopener">저장소 eoinjeong_root</a> · 증명서: 릴리스 ' +
      D.tags.map(function (t) { return '<a href="https://github.com/baekjw2435/AI-/releases/tag/' + esc(t) + '" target="_blank" rel="noopener">' + esc(t) + "</a>"; }).join(", ") + "</div>";
  }

  function show() {
    var p = parse(location.hash);
    if (p) renderPath(p.si, p.h); else renderMap();
  }

  // ── 지도 ──────────────────────────────────────────────
  function renderMap() {
    document.title = "어인정 수순 지도";
    var order = D.syllables.map(function (s, i) { return i; }).sort(function (a, b) {
      return D.syllables[a].s < D.syllables[b].s ? -1 : 1;
    });
    var cells = order.map(function (i) {
      var s = D.syllables[i], ids = legal(i, []), wins = ids.filter(function (w) { var n = node(i, [w]); return n && n.r === "L"; }).length;
      var alt = conv(s.s), same = alt && !(byFirst.get(s.s) || []).length ? alt : "";
      var title = s.s + (same ? "(=" + same + ")" : "") + ": " + (s.r === "W" ? "받는 쪽 승" : "받는 쪽 패") +
        " · 첫 수 " + ids.length + "개 중 이기는 수 " + wins + "개";
      return '<button class="cell ' + (s.r === "W" ? "win" : "lose") + '" data-si="' + i + '" title="' + esc(title) + '" aria-label="' + esc(title) + '">' +
        esc(s.s) + (same ? '<span class="of">=' + esc(same) + "</span>" : "") + "</button>";
    }).join("");
    view.innerHTML =
      '<div class="section">' +
        "<h2>받은 음절</h2>" +
        '<p class="note">아무 단어도 쓰지 않은 채 그 음절을 받은 자리입니다. 칸 색은 그 음절로 시작해야 하는 사람(받는 쪽)의 결과입니다. 칸 위에 손을 올리면 이기는 첫 수가 몇 개인지 보입니다.</p>' +
        '<div class="sheet"><div class="grid">' + cells + "</div>" +
        '<div class="legend"><span><i class="sw win"></i>받으면 승</span><span><i class="sw lose"></i>받으면 패</span><span>=율: 그 음절로 시작하는 단어가 없어 두음법칙의 음절로만 받는 칸</span></div></div>' +
      "</div>" +
      '<div class="section"><h2>읽는 법</h2><ul class="note">' +
        "<li><b>받는 쪽</b>은 음절을 받아 먼저 두는 사람, <b>낸 쪽</b>은 그 음절을 넘긴 사람입니다.</li>" +
        "<li><b>확정</b>은 그 자리의 증명서가 verify_v4의 수락 조건(종료 코드 0, verified, 결과 일치, deflate-exact, 사전·국면·입력·증명서 sha256 일치)을 모두 통과한 것만입니다. 자리마다 증명서 파일로 가는 링크가 있습니다.</li>" +
        "<li>계산한 범위: 173음절의 모든 첫 수, 받으면 지는 음절에서 첫 수마다 낸 쪽의 모든 2번째 수, 이기는 쪽이 이기는 수를 두었을 때 진 쪽의 모든 응수와 그 뒤 이기는 쪽의 모든 수. 그 밖의 자리는 <b>미확인</b>으로 보입니다.</li>" +
        "<li>미확인 자리도 규칙에 맞는 수로 계속 따라갈 수 있습니다. 둘 단어가 없으면 둘 차례인 쪽이 집니다.</li>" +
        "<li>브라우저의 뒤로 가기는 한 수 전으로 돌아갑니다. 주소를 보내면 같은 수순이 열립니다.</li>" +
      "</ul></div>";
    view.querySelectorAll("[data-si]").forEach(function (b) {
      b.addEventListener("click", function () { location.hash = route(+b.dataset.si, []); window.scrollTo(0, 0); });
    });
  }

  // ── 탐색기 ────────────────────────────────────────────
  function cellsOf(word, cls) {
    return Array.prototype.map.call(word, function (ch, k) {
      var c = k === 0 ? "pc head" : "pc";
      if (k === word.length - 1 && cls) c += " tail";
      return '<span class="' + c + '">' + esc(ch) + "</span>";
    }).join("");
  }
  function moveTag(si, h, k) {
    var n = node(si, h.slice(0, k + 1)), prev = node(si, h.slice(0, k));
    if (n) return n.r === "L" ? '<span class="tag win">이기는 수</span>' : '<span class="tag lose">지는 수</span>';
    if (prev && prev.r === "L") return '<span class="tag lose">지는 수</span>';
    return '<span class="tag">미확인</span>';
  }
  function renderPath(si, h) {
    var s = D.syllables[si], ply = h.length, n = node(si, h), ids = legal(si, h), cur = current(si, h), alt = conv(cur);
    var rows = '<div class="row"><div class="who"><b>받은 음절</b>' + (alt ? "두음 " + esc(alt) + "도 가능" : "") + '</div><div class="line"><span class="pc tail">' + esc(s.s) + "</span></div><span></span></div>";
    h.forEach(function (w, k) {
      rows += '<div class="row"><div class="who"><b>' + (k + 1) + "수</b>" + mover(k) + '</div><div class="line">' + cellsOf(D.words[w], true) + "</div>" + moveTag(si, h, k) + "</div>";
    });
    var verdict;
    if (n) {
      var winner = n.r === "W" ? mover(ply) : other(ply);
      verdict = '<p class="verdict ' + (n.r === "W" ? "win" : "lose") + '">이 자리 판정: <b>' + winner + " 승</b> (확정)</p>" +
        '<p class="proof">증명서 <a href="' + esc(certUrl(n)) + '" target="_blank" rel="noopener">' + esc(D.certs[n.c][1].slice(0, 16)) + "….v4.gz</a> · " + esc(D.tags[D.certs[n.c][0]]) + "</p>";
    } else if (!ids.length) {
      verdict = '<p class="verdict lose">이 자리 판정: <b>' + other(ply) + " 승</b> (" + mover(ply) + "이 둘 단어가 없음)</p>";
    } else {
      verdict = '<p class="verdict open">이 자리 판정: <b>미확인</b> (아직 계산하지 않은 자리)</p>';
    }
    var win = [], lose = [], open = [];
    ids.forEach(function (i) {
      var c = node(si, h.concat([i]));
      (c ? (c.r === "L" ? win : lose) : open).push(i);
    });
    function chips(list, cls) {
      if (!list.length) return '<p class="empty">없음</p>';
      return '<div class="moves">' + list.map(function (i) {
        var w = D.words[i];
        return '<button class="mv ' + cls + '" data-w="' + i + '">' + esc(w.slice(0, -1)) + '<span class="t">' + esc(last(w)) + "</span></button>";
      }).join("") + "</div>";
    }
    var groups = "";
    if (!ids.length) groups = '<p class="empty">' + esc(cur) + (alt ? "·" + esc(alt) : "") + "(으)로 시작하는 남은 단어가 없습니다.</p>";
    else {
      if (win.length || lose.length) {
        groups += '<div class="group"><h3>이기는 수 <span class="n">' + win.length + "</span></h3>" + chips(win, "win") + "</div>";
        groups += '<div class="group"><h3>지는 수 <span class="n">' + lose.length + "</span></h3>" + chips(lose, "lose") + "</div>";
      }
      if (open.length) groups += '<div class="group"><h3>미확인 <span class="n">' + open.length + '</span></h3><p class="note">이 수 뒤의 자리는 아직 계산하지 않았습니다.</p>' + chips(open, "") + "</div>";
    }
    view.innerHTML =
      '<div class="section">' +
        '<div class="bar"><button class="btn" id="b-map">← 지도</button><button class="btn" id="b-undo"' + (ply ? "" : " disabled") + '>한 수 무르기</button><button class="btn" id="b-reset"' + (ply ? "" : " disabled") + ">처음부터</button></div>" +
        '<div class="sheet"><div class="rows">' + rows + "</div></div>" +
      "</div>" +
      '<div class="now">' +
        '<div class="now-head"><h2 id="now-title" tabindex="-1">' + (ply + 1) + "수 · " + mover(ply) + " 차례</h2>" +
          '<span class="pill">' + esc(cur) + (alt ? " 또는 " + esc(alt) : "") + "(으)로 시작</span></div>" +
        verdict +
        '<p class="note">' + (ids.length ? mover(ply) + "이 둘 수 있는 단어 " + ids.length + "개입니다. 단어를 누르면 그 수를 둡니다. 파란 글자가 상대에게 넘기는 음절입니다." : "") + "</p>" +
        groups +
      "</div>";
    document.getElementById("b-map").addEventListener("click", function () { location.hash = "map"; });
    document.getElementById("b-undo").addEventListener("click", function () { if (ply) location.hash = route(si, h.slice(0, -1)); });
    document.getElementById("b-reset").addEventListener("click", function () { if (ply) location.hash = route(si, []); });
    view.querySelectorAll("[data-w]").forEach(function (b) {
      b.addEventListener("click", function () { location.hash = route(si, h.concat([+b.dataset.w])); });
    });
    document.title = s.s + (h.length ? " → " + h.map(function (i) { return D.words[i]; }).join(" → ") : "") + " · 어인정 수순 지도";
  }

  load();
})();
</script>
